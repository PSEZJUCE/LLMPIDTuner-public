name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync development environment
        run: uv sync --group dev --locked
      - name: Lint
        run: uv run ruff check src tests scripts/paper
      - name: Test
        run: uv run pytest -q
      - name: Verify frozen protocol assets
        run: uv run llmpidtuner build-protocol-assets --check